<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉ mình em</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            margin: 0;
        }

        .container {
            text-align: center;
        }

    
        .heart {
            font-size: 80px;
            color: #ff4d4d;
            cursor: pointer;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.8s ease;
            user-select: none;
            display: inline-block;
            padding: 20px; /
        }


        .heart.grow {
            transform: scale(2.2);
            filter: drop-shadow(0 0 25px rgba(255, 77, 77, 0.9)) drop-shadow(0 0 10px rgba(255, 0, 0, 0.5));
        }

        .hint-text {
            font-size: 18px;
            color: #555;
            margin-top: 10px;
            transition: opacity 0.5s;
        }

        .secret-message {
            font-size: 26px;
            font-weight: bold;
            color: #cc0000;
            margin-top: 50px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease-in-out;
         
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }


        .secret-message.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
     
        <div class="heart" id="heartBtn" onclick="revealLove()">❤️</div>
        
 
        <div class="hint-text" id="hint">Click here to take my heart</div>
        
   
        <div class="secret-message" id="message">You are my only one</div>
    </div>

    <script>
        function revealLove() {
           
            document.getElementById('heartBtn').classList.add('grow');
            
            document.getElementById('hint').style.opacity = '0';
            
        
            setTimeout(() => {
                document.getElementById('message').classList.add('show');
            }, 600); 
        }
    </script>

</body>
</html>
