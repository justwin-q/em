<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Are My Only One</title>
    <style>
        /* 1. PHẦN TRANG TRÍ NỀN HỒNG, CĂN GIỮA, KHÓA CUỘN */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6e6; /* Nền hồng lãng mạn */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Khóa cuộn trang */
            margin: 0;
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 2. HIỆU ỨNG NÚT BẤM TRÁI TIM BAN ĐẦU */
        .heart-btn {
            font-size: 80px;
            cursor: pointer;
            display: inline-block;
            padding: 20px;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.8s ease, opacity 0.5s;
            user-select: none;
            z-index: 10;
        }

        /* Khi bấm vào nút, nó bự lên và phát sáng trước khi biến mất */
        .heart-btn.grow {
            transform: scale(2.2);
            filter: drop-shadow(0 0 25px rgba(255, 77, 77, 0.9));
            opacity: 0;
            pointer-events: none;
        }

        .hint-text {
            font-size: 18px;
            color: #555;
            margin-top: 10px;
            transition: opacity 0.5s;
            z-index: 10;
        }

        /* Vùng vẽ trái tim chữ (Canvas) ẩn lúc đầu */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
        }
        canvas.show {
            opacity: 1;
        }

        /* 3. THÔNG ĐIỆP BÍ MẬT HIỆN SỰ MUỘN NẰM TRÊN CÙNG */
        .secret-message {
            position: absolute;
            font-size: 45px; /* Chữ bự nổi bật ở trung tâm */
            font-family: 'Georgia', serif;
            font-weight: bold;
            color: #cc0000;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 1.5s ease, transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 0 15px rgba(255, 192, 203, 0.8);
            z-index: 20;
            pointer-events: none;
        }

        .secret-message.show {
            opacity: 1;
            transform: scale(1);
            /* Thêm hiệu ứng đập phập phồng nhẹ giống Pygame */
            animation: pulse 2s infinite alternate ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Thẻ Audio ẩn dùng để phát nhạc nền -->
        <audio id="bgMusic" src="golden_hour.mp3" loop></audio>

        <!-- Bước 1: Trái tim nút bấm ban đầu -->
        <div class="heart-btn" id="heartBtn" onclick="startLoveAnimation()">❤️</div>
        <div class="hint-text" id="hint">Click here to take my heart</div>
        
        <!-- Bước 2: Nơi vẽ hiệu ứng trái tim ghép từ chữ nhỏ -->
        <canvas id="heartCanvas"></canvas>

        <!-- Bước 3: Dòng chữ bí mật xuất hiện muộn nhất -->
        <div class="secret-message" id="message">You Are My Only One</div>
    </div>

    <script>
        const WORDS = ["i love you", "love u", "my bae"];
        const COLORS = ["#ffc0cb", "#ff69b4", "#ff1493", "#db7093", "#ffb6c1"];
        const SCALE = 13; 

        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId;
        let currentFrame = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, order, kind) {
                this.targetX = x;
                this.targetY = y;
                this.x = x + (Math.random() - 0.5) * 100; 
                this.y = y + (Math.random() - 0.5) * 100;
                this.order = order;
                this.kind = kind;
                this.word = WORDS[Math.floor(Math.random() * WORDS.length)];
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.alpha = 0;
                this.flicker = Math.random() * Math.PI * 2;
                this.sizeMult = 0.85 + Math.random() * 0.3;
                this.delay = kind === "outline" ? order * 1.5 : 240 + Math.random() * 150;
            }

            update(frame) {
                if (frame > this.delay) {
                    if (this.alpha < 255) this.alpha += 5;
                    this.x += (this.targetX - this.x) * 0.1;
                    this.y += (this.targetY - this.y) * 0.1;
                }

                let flick = 1.0;
                if (this.alpha >= 255) {
                    flick = 0.75 + 0.25 * Math.sin(frame * 0.04 + this.flicker);
                }
                return Math.min(255, this.alpha * flick) / 255;
            }

            draw(frame) {
                let currentAlpha = this.update(frame);
                if (currentAlpha <= 0) return;

                ctx.save();
                ctx.globalAlpha = currentAlpha;
                ctx.fillStyle = this.color;
                ctx.font = `bold ${this.kind === "outline" ? 14 : 11}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;

                ctx.fillText(this.word, this.x, this.y);
                ctx.restore();
            }
        }

        function heartXY(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return { x: x, y: -y };
        }

        function toScreen(x, y) {
            return {
                x: x * SCALE + canvas.width / 2,
                y: y * SCALE + canvas.height / 2 - 20
            };
        }

        function buildHeart() {
            for (let i = 0; i < 150; i++) {
                let t = (i / 150) * 2 * Math.PI;
                let pos = heartXY(t);
                let screenPos = toScreen(pos.x, pos.y);
                particles.push(new Particle(screenPos.x, screenPos.y, i, "outline"));
            }
            for (let i = 0; i < 120; i++) {
                let t = Math.random() * 2 * Math.PI;
                let r = Math.random() * 0.85;
                let pos = heartXY(t);
                let screenPos = toScreen(pos.x * r, pos.y * r);
                particles.push(new Particle(screenPos.x, screenPos.y, i, "fill"));
            }
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            currentFrame++;

            particles.forEach(p => p.draw(currentFrame));

            // CHỖ TỰ CHỈNH THỜI GIAN CHỮ XUẤT HIỆN (450 frame tương đương ~7.5 giây)
            if (currentFrame > 450) {
                document.getElementById('message').classList.add('show');
            }

            animationFrameId = requestAnimationFrame(loop);
        }

        // Hàm kích hoạt khi người dùng click vào trái tim ❤️ ban đầu
        function startLoveAnimation() {
            // ĐOẠN PHÁT NHẠC KHI CÓ HÀNH ĐỘNG CLICK CỦA NGƯỜI DÙNG
            const music = document.getElementById('bgMusic');
            music.play().catch(error => {
                console.log("Không thể tự động phát nhạc do chính sách bảo mật trình duyệt:", error);
            });

            // Phóng to nút bấm cũ và ẩn đi
            document.getElementById('heartBtn').classList.add('grow');
            document.getElementById('hint').style.opacity = '0';

            setTimeout(() => {
                document.getElementById('heartBtn').style.display = 'none';
                document.getElementById('hint').style.display = 'none';
                
                canvas.classList.add('show');
                buildHeart();
                loop();
            }, 600); 
        }
    </script>
</body>
</html>
