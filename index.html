<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I love you</title>
    <style>
        body {
            margin: 0;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            background-color: #000000;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.2);
        }
        #click-screen {
            position: absolute;
            color: #ff69b4;
            font-size: 24px;
            cursor: pointer;
            text-align: center;
            background: rgba(0,0,0,0.9);
            padding: 20px 40px;
            border-radius: 10px;
            border: 2px solid #ff1493;
            box-shadow: 0 0 20px #ff1493;
            z-index: 10;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="click-screen" onclick="startEffect()">Click here to take my heart</div>
    <canvas id="heartCanvas"></canvas>
    <audio id="bgMusic" src="golden_hour.mp3" loop></audio>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // Giữ nguyên kích thước khủng từ code Python gốc của bạn
        const WIDTH = 2000;
        const HEIGHT = 1200;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        // Tự động fit khung canvas vào màn hình laptop để không bị tràn màn hình
        function fitCanvas() {
            const aspect = WIDTH / HEIGHT;
            const w = window.innerWidth;
            const h = window.innerHeight;
            if (w / h > aspect) {
                canvas.style.width = (h * aspect) + 'px';
                canvas.style.height = h + 'px';
            } else {
                canvas.style.width = w + 'px';
                canvas.style.height = (w / aspect) + 'px';
            }
        }
        fitCanvas();
        window.addEventListener('resize', fitCanvas);

        const WORDS = ["i love you", "love u", "my bae"];
        const CENTER_TEXT = "You Are The Only One ";
        const COLORS = [
            "rgb(255, 192, 203)",
            "rgb(255, 105, 180)",
            "rgb(255, 20, 147)",
            "rgb(219, 112, 147)",
            "rgb(255, 182, 193)"
        ];
        const SCALE = 20;

        class Particle {
            constructor(x, y, order, kind) {
                this.x = x;
                this.y = y;
                this.order = order;
                this.kind = kind;
                this.word = WORDS[Math.floor(Math.random() * WORDS.length)];
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.alpha = 0;
                this.flicker = Math.random() * Math.PI * 2;
                this.delay = 0;
                this.size_mult = 0.85 + Math.random() * 0.3; // tương đương random.uniform(0.85, 1.15)
            }
        }

        function heart_xy(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return { x: x, y: -y };
        }

        function to_screen(x, y) {
            return {
                x: x * SCALE + WIDTH / 2,
                y: y * SCALE + HEIGHT / 2 - 40
            };
        }

        function build_outline_particles(n_outline, min_gap = 30) {
            let pts = [], placed = [];
            for (let i = 0; i < n_outline; i++) {
                let t = (i / n_outline) * 2 * Math.PI;
                let p = heart_xy(t);
                let s = to_screen(p.x, p.y);
                if (placed.some(q => Math.hypot(s.x - q.x, s.y - q.y) < min_gap)) continue;
                placed.push(s);
                pts.push(new Particle(s.x, s.y, i, "outline"));
            }
            return pts;
        }

        function build_fill_particles(n_fill, min_gap = 46) {
            let pts = [], placed = [];
            let attempts = 0;
            while (pts.length < n_fill && attempts < n_fill * 80) {
                attempts++;
                let t = Math.random() * 2 * Math.PI;
                let r = Math.random() * 0.86;
                let base = heart_xy(t);
                let s = to_screen(base.x * r, base.y * r);
                if (placed.some(q => Math.hypot(s.x - q.x, s.y - q.y) < min_gap)) continue;
                placed.push(s);
                pts.push(new Particle(s.x, s.y, Math.floor(Math.random() * 321), "fill"));
            }
            return pts;
        }

        let outline = build_outline_particles(160);
        let fill = build_fill_particles(130);

        let outline_span = outline.length > 0 ? Math.max(...outline.map(p => p.order)) : 0;
        const frames_per_step = 1.6;
        let fill_start_frame = Math.floor(outline_span * frames_per_step) + 30;

        outline.forEach(p => p.delay = Math.floor(p.order * frames_per_step));
        fill.forEach(p => p.delay = fill_start_frame + p.order);
        let particles = [...outline, ...fill];

        let frame = 0;
        let isRunning = false;

        function startEffect() {
            document.getElementById('click-screen').style.display = 'none';
            document.getElementById('bgMusic').play().catch(() => {});
            isRunning = true;
            loop();
        }

        function loop() {
            if (!isRunning) return;

            // Xóa màn hình về màu đen
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            frame++;

            particles.forEach(p => {
                // Tăng alpha chậm rãi giống p.alpha + 14 + random
                if (frame > p.delay && p.alpha < 255) {
                    p.alpha = Math.min(255, p.alpha + 14 + Math.floor(Math.random() * 5));
                }
                if (p.alpha <= 0) return;

                // Giữ nguyên công thức tính flicker chớp nháy của Python gốc
                let flick = p.alpha >= 255 ? 0.75 + 0.25 * Math.sin(frame * 0.04 + p.flicker) : 1.0;
                let currentAlpha = (p.alpha / 255) * flick;

                ctx.save();
                ctx.globalAlpha = currentAlpha;
                ctx.fillStyle = p.color;

                // Set cỡ font chuẩn 20 và 17 như bản gốc Python
                let baseFontSize = p.kind === "outline" ? 20 : 17;
                let fontSize = Math.floor(baseFontSize * p.size_mult);
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Giữ nguyên hiệu ứng Glow Phát Sáng Neon đa tầng (Glow Layer)
                if (currentAlpha > 0.04) {
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 15;
                }
                ctx.fillText(p.word, p.x, p.y);
                ctx.restore();
            });

            // Giữ nguyên thời gian xuất hiện và độ co giãn của chữ trung tâm
            let center_start = fill_start_frame + 200;
            if (frame > center_start) {
                let progress = Math.min(1.0, (frame - center_start) / 60);
                let center_alpha = 1 - Math.exp(-progress * 8);
                let pulse = 1.0 + 0.025 * Math.sin(frame * 0.05);

                ctx.save();
                ctx.globalAlpha = center_alpha;
                ctx.fillStyle = "#e072b1";
                
                // Giữ font Georgia cỡ 54 chuẩn gốc
                let centerFontSize = Math.floor(54 * pulse);
                ctx.font = `bold ${centerFontSize}px Georgia`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Hiệu ứng phát sáng cho chữ giữa
                ctx.shadowColor = "#e072b1";
                ctx.shadowBlur = 25;
                
                ctx.fillText(CENTER_TEXT, WIDTH / 2, HEIGHT / 2);
                ctx.restore();
            }

            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
