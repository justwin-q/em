<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Heart For You</title>
    <style>
        /* GIỮ NGUYÊN 100% TRANG TRÍ NỀN HỒNG, CĂN GIỮA, KHÓA CUỘN */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6e6; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
            margin: 0;
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* GIỮ NGUYÊN HIỆU ỨNG NÚT BẤM TRÁI TIM BAN ĐẦU */
        .heart-btn {
            font-size: 80px;
            cursor: pointer;
            display: inline-block;
            padding: 20px;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.8s ease, opacity 0.5s;
            user-select: none;
            z-index: 10;
        }

        .heart-btn.grow {
            transform: scale(2.2);
            filter: drop-shadow(0 0 25px rgba(255, 77, 77, 0.9));
            opacity: 0;
            pointer-events: none;
        }

        .hint-text {
            font-size: 18px;
            color: #555;
            margin-top: 10px;
            transition: opacity 0.5s;
            z-index: 10;
        }

        /* Canvas vẽ hiệu ứng trái tim chữ */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
        }
        canvas.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- FILE NHẠC NỀN -->
        <audio id="bgMusic" src="golden_hour.mp3" loop></audio>

        <!-- Bước 1: Trái tim nút bấm ban đầu -->
        <div class="heart-btn" id="heartBtn" onclick="startLoveAnimation()">❤️</div>
        <div class="hint-text" id="hint">Click here to take my heart</div>
        
        <!-- Bước 2: Nơi các chữ nhỏ xuất hiện lấp đầy trái tim -->
        <canvas id="heartCanvas"></canvas>
    </div>

    <script>
        const WORDS = ["i love you", "miss u so much", "yeu van anh"];
        const COLORS = ["#ffc0cb", "#ff69b4", "#ff1493", "#db7093", "#ffb6c1"];
        const SCALE = 19; 

        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId;
        let currentFrame = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, delay, kind) {
                this.targetX = x;
                this.targetY = y;
                this.x = canvas.width / 2 + (Math.random() - 0.5) * 40;
                this.y = canvas.height / 2 - 40 + (Math.random() - 0.5) * 40;
                this.kind = kind;
                this.word = WORDS[Math.floor(Math.random() * WORDS.length)];
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.alpha = 0;
                this.flicker = Math.random() * Math.PI * 2;
                this.delay = delay;
            }

            update(frame) {
                if (frame > this.delay) {
                    if (this.alpha < 255) this.alpha += 1.5; 
                    this.x += (this.targetX - this.x) * 0.05; 
                    this.y += (this.targetY - this.y) * 0.05;
                }

                let flick = 1.0;
                if (this.alpha >= 255) {
                    flick = 0.8 + 0.2 * Math.sin(frame * 0.04 + this.flicker);
                }
                return Math.min(255, this.alpha * flick) / 255;
            }

            draw(frame) {
                let currentAlpha = this.update(frame);
                if (currentAlpha <= 0) return;

                ctx.save();
                ctx.globalAlpha = currentAlpha;
                ctx.fillStyle = this.color;
                ctx.font = `bold ${this.kind === "outline" ? 15 : 12}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;

                ctx.fillText(this.word, this.x, this.y);
                ctx.restore();
            }
        }

        function heartXY(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return { x: x, y: -y };
        }

        function toScreen(x, y) {
            return {
                x: x * SCALE + canvas.width / 2,
                y: y * SCALE + canvas.height / 2 - 40
            };
        }

        /* THUẬT TOÁN MỚI: VẼ TỪ GIỮA SANG HAI BÊN VÀ TĂNG CHỮ LẤP ĐẦY KHÍT KHÔNG KHE HỞ */
        function buildHeart() {
            let maxOutlineDelay = 0;
            const n_outline = 200; // Tăng viền lên 200 chữ cho khít hơn nữa

            // 1. Vẽ viền: Bắt đầu từ trục giữa (đỉnh & đáy) rồi bò lan sang hai bên đối xứng rất đẹp
            for (let i = 0; i < n_outline; i++) {
                let t = (i / n_outline) * 2 * Math.PI;
                let pos = heartXY(t);
                let screenPos = toScreen(pos.x, pos.y);
                
                // Công thức tính khoảng cách góc đến trục giữa (t = PI/2 và t = 3*PI/2)
                // Giúp chữ xuất hiện từ đỉnh giữa tràn sang hai bên eo và từ đáy giữa đi lên
                let distToCenterAxis = Math.abs(Math.cos(t)); 
                let calculatedDelay = (1 - distToCenterAxis) * 600; // 600 frame giúp hai nhánh bò cực kỳ chậm rãi
                
                if (calculatedDelay > maxOutlineDelay) {
                    maxOutlineDelay = calculatedDelay;
                }

                particles.push(new Particle(screenPos.x, screenPos.y, calculatedDelay, "outline"));
            }

            // 2. Ruột trái tim: TĂNG LÊN HẲN 900 CHỮ siêu khổng lồ để lấp đặc hoàn toàn, không còn khoảng trống
            for (let i = 0; i < 900; i++) { 
                let t = Math.random() * 2 * Math.PI;
                // Phân bổ chữ đều từ lõi ra rìa, tăng mật độ ở những phần sườn eo
                let r = Math.sqrt(Math.random()) * 0.96; 
                let pos = heartXY(t);
                let screenPos = toScreen(pos.x * r, pos.y * r);
                
                // Các chữ trong ruột xuất hiện rải rác lững lờ đan xen sau đó để khớp nhạc kéo dài
                let randomDelay = (maxOutlineDelay * 0.4) + Math.random() * 2800; 
                particles.push(new Particle(screenPos.x, screenPos.y, randomDelay, "fill"));
            }
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            currentFrame++;

            particles.forEach(p => p.draw(currentFrame));

            animationFrameId = requestAnimationFrame(loop);
        }

        function startLoveAnimation() {
            const music = document.getElementById('bgMusic');
            music.play().catch(e => console.log("Music play blocked:", e));

            document.getElementById('heartBtn').classList.add('grow');
            document.getElementById('hint').style.opacity = '0';

            setTimeout(() => {
                document.getElementById('heartBtn').style.display = 'none';
                document.getElementById('hint').style.display = 'none';
                
                canvas.classList.add('show');
                buildHeart();
                loop();
            }, 600); 
        }
    </script>
</body>
</html>
